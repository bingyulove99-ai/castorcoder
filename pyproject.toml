[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "castorcoder"
version = "1.3.0"
description = "可观测、工作区安全、受 Claude Code 架构启发的 AI 编程 Agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Yufeng He" },
    { name = "CastorCoder contributors" },
]
keywords = [
    "ai", "agent", "coding", "cli", "llm", "claude-code", "multi-agent",
    "skills", "observability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "openai>=1.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "python-dotenv>=1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
litellm = ["litellm>=1.60.0,<2.0.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
]

[project.scripts]
castorcoder = "castorcoder.cli:main"
castor = "castorcoder.cli:main"
castorcoder-eval = "castorcoder.evals.__main__:main"

[project.urls]
Homepage = "https://github.com/bingyulove99-ai/castorcoder"
Repository = "https://github.com/bingyulove99-ai/castorcoder"
Upstream = "https://github.com/he-yufeng/CastorCoder"

[tool.hatch.build.targets.wheel]
packages = ["castorcoder"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["castorcoder"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
