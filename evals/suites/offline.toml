[suite]
name = "offline"
fixture_root = "evals/fixtures"

[[tasks]]
id = "edit-rename"
kind = "scripted"
fixture = "rename"
prompt = "Rename the add function to sum_values."
verify = "python verify.py"
max_rounds = 10
tags = ["tools", "edit"]

[[tasks.steps]]
content = "I will inspect the file first."
[[tasks.steps.tool_calls]]
name = "read_file"
arguments = { file_path = "calc.py" }

[[tasks.steps]]
content = "Applying a targeted replacement."
[[tasks.steps.tool_calls]]
name = "edit_file"
arguments = { file_path = "calc.py", old_string = "def add(a, b):", new_string = "def sum_values(a, b):" }

[[tasks.steps]]
content = "Renamed the function."

[[tasks]]
id = "bugfix-average"
kind = "scripted"
fixture = "bugfix"
prompt = "The test fails. Find the bug and fix it."
verify = "python -m pytest -q"
max_rounds = 10
tags = ["tools", "bugfix"]

[[tasks.steps]]
content = "Reading the failing implementation."
[[tasks.steps.tool_calls]]
name = "read_file"
arguments = { file_path = "math_utils.py" }

[[tasks.steps]]
content = "The average function adds one by mistake."
[[tasks.steps.tool_calls]]
name = "edit_file"
arguments = { file_path = "math_utils.py", old_string = "return sum(values) / len(values) + 1", new_string = "return sum(values) / len(values)" }

[[tasks.steps]]
content = "Fixed the off-by-one return value."

[[tasks]]
id = "plan-blocks-write"
kind = "scripted"
fixture = "policy"
prompt = "Create created.txt."
verify = "python verify.py"
permission_mode = "plan"
expect_stop_reason = "completed"
max_rounds = 5
tags = ["policy", "security"]

[[tasks.steps]]
content = "Attempting a write in plan mode."
[[tasks.steps.tool_calls]]
name = "write_file"
arguments = { file_path = "created.txt", content = "blocked" }

[[tasks.steps]]
content = "The write was blocked by policy."

[[tasks]]
id = "loop-guard"
kind = "scripted"
fixture = "rename"
prompt = "Repeat the same read forever."
expect_stop_reason = "loop_guard"
max_rounds = 10
tags = ["reliability", "loop"]

[[tasks.steps]]
content = "Reading again."
[[tasks.steps.tool_calls]]
name = "read_file"
arguments = { file_path = "calc.py" }

[[tasks.steps]]
content = "Reading again."
[[tasks.steps.tool_calls]]
name = "read_file"
arguments = { file_path = "calc.py" }

[[tasks.steps]]
content = "Reading again."
[[tasks.steps.tool_calls]]
name = "read_file"
arguments = { file_path = "calc.py" }

[[tasks]]
id = "index-tool"
kind = "scripted"
fixture = "sample_repo"
prompt = "Find where workspace path validation lives."
use_index = true
max_rounds = 8
tags = ["retrieval", "tools"]

[[tasks.steps]]
content = "Searching the local index."
[[tasks.steps.tool_calls]]
name = "search_code"
arguments = { query = "workspace path validation", k = 3 }

[[tasks.steps]]
content = "Found the workspace module."

[[tasks]]
id = "memory-tool"
kind = "scripted"
fixture = "rename"
prompt = "Remember that this project always runs pytest before committing."
use_memory = true
max_rounds = 8
tags = ["memory", "tools"]

[[tasks.steps]]
content = "Saving the convention."
[[tasks.steps.tool_calls]]
name = "update_memory"
arguments = { action = "add", kind = "convention", content = "Always run pytest before committing.", source = "eval" }

[[tasks.steps]]
content = "Recalling the convention."
[[tasks.steps.tool_calls]]
name = "search_memory"
arguments = { query = "commit checks", k = 3 }

[[tasks.steps]]
content = "Convention stored."

[[tasks]]
id = "retrieval-sample"
kind = "retrieval"
fixture = "sample_repo"
k = 3
min_recall = 0.66
tags = ["retrieval"]

[[tasks.queries]]
query = "where is workspace path containment validated"
gold = ["package/workspace.py#Workspace"]

[[tasks.queries]]
query = "tool registry lookup by name"
gold = ["package/tools.py#ToolRegistry"]

[[tasks.queries]]
query = "how to add a custom tool with a JSON schema"
gold = ["docs/guide.md#Adding a custom tool"]

[[tasks]]
id = "memory-recall"
kind = "memory_retrieval"
k = 3
min_recall = 0.75
tags = ["memory"]

[[tasks.facts]]
kind = "decision"
content = "The project uses SQLite FTS5 for hybrid code retrieval."
[[tasks.facts]]
kind = "fact"
content = "Path validation happens in Workspace.resolve before any file tool runs."
[[tasks.facts]]
kind = "preference"
content = "Always run ruff before committing changes."
[[tasks.facts]]
kind = "error"
content = "A previous bug was caused by executing tool calls serially when reads could be parallel."

[[tasks.queries]]
query = "which storage does retrieval use"
gold = ["SQLite FTS5"]

[[tasks.queries]]
query = "where does path validation happen"
gold = ["Workspace.resolve"]

[[tasks.queries]]
query = "what check runs before commits"
gold = ["ruff"]

[[tasks.queries]]
query = "serial tool call bug"
gold = ["serially"]
