name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check castorcoder tests evals/scripts
      - name: Compile
        run: python -m compileall -q castorcoder tests evals/scripts

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: CLI smoke test
        env:
          CASTORCODER_API_KEY: ci-placeholder
        run: python -m castorcoder --doctor

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --cov=castorcoder --cov-report=term-missing --cov-fail-under=80 tests/

  evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Offline evaluation suite
        run: python -m castorcoder.evals --suite evals/suites/offline.toml --verbose
      - name: Repository retrieval benchmark
        run: python -m castorcoder.evals --suite evals/suites/retrieval_repo.toml --verbose
      - name: Retrieval k-sweep
        run: python -m castorcoder.evals --suite evals/suites/retrieval_repo_depth.toml --verbose
      - name: Dataset adapter preflight
        run: python evals/scripts/validate_datasets.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Build
        run: |
          python -m pip install -U pip build twine
          python -m build
          python -m twine check dist/*
